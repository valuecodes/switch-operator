name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # PR runs are superseded by a newer push. A *running* main run (which may be
  # deploying) is never cancelled; a *pending* one is still replaced by a newer
  # push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Root package.json script names. No workspace has a build script, so
        # `build` is left out.
        task: [typecheck, lint, knip, "format:check", test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      # zizmor prefers the `$/` self-repository syntax, but actionlint 1.7.12
      # rejects it; switch once actionlint accepts `$/`.
      - name: Setup
        uses: ./.github/actions/setup # zizmor: ignore[self-repository]

      # Turbo's local cache, restored from the latest run of the same task so an
      # unchanged package replays instead of rerunning. Only typecheck and test
      # go through Turbo; lint, knip and format:check have no `.turbo`.
      - name: Turbo cache
        if: contains(fromJSON('["typecheck", "test"]'), matrix.task)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ matrix.task }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ matrix.task }}-

      # The task name goes through `env`, never straight into `run`.
      - name: Run ${{ matrix.task }}
        env:
          TASK: ${{ matrix.task }}
        run: pnpm "$TASK"

  secrets-scan:
    name: secrets-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Full history: gitleaks scans every commit, not just the checked-out tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Same script as `pnpm secrets:scan`; runs the pinned gitleaks Docker
      # image, so no pnpm/Node setup is needed.
      - name: Scan for secrets
        run: sh .github/scripts/secrets-scan.sh

  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # The workflow files are checked by the `workflow-lint` job instead.
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      # Advanced setup: turn OFF "default setup" under Settings → Code security,
      # or GitHub rejects these uploads. No build step is needed.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:${{ matrix.language }}"

  # actionlint (with shellcheck on `run:` scripts) and zizmor over the workflow
  # and action files. Shows up as `workflow-lint / actionlint` and `/ zizmor`.
  workflow-lint:
    permissions:
      contents: read
    uses: valuecodes/automation/.github/workflows/workflow-lint.yml@faff74cb5d78478b0bd271db840916706dc2cce0 # v0.3.1

  # The one check to require in branch protection. `if: always()` makes it run
  # even when a needed job failed, so it reports a failure instead of skipping.
  all-passed:
    name: all-passed
    runs-on: ubuntu-latest
    timeout-minutes: 1
    if: always()
    needs: [check, secrets-scan, codeql, workflow-lint]
    permissions: {}
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "a required job ended with: $r"; exit 1; }
          done

  # Deploys the workers once every check passed on a push to main. The `if:`
  # only skips PR runs; the real security boundary is the `production`
  # environment's deployment-branch rule (main only), set under Settings →
  # Environments. D1 migrations apply separately, from `migrations.yml`.
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: all-passed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup
        uses: ./.github/actions/setup # zizmor: ignore[self-repository]

      - name: Deploy browser-scraper to Cloudflare Workers
        run: pnpm --filter @repo/browser-scraper run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy operator to Cloudflare Workers
        run: pnpm --filter @repo/operator run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy alerts to Cloudflare Workers
        run: pnpm --filter @repo/alerts run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
