name: D1 Migrations

on:
  push:
    branches: [main]
    paths:
      - "apps/operator/migrations/**"

permissions: {}

concurrency:
  group: d1-migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    name: apply-migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      # zizmor prefers the `$/` self-repository syntax, but actionlint 1.7.12
      # rejects it; switch once actionlint accepts `$/`.
      - name: Setup
        uses: ./.github/actions/setup # zizmor: ignore[self-repository]

      - name: Apply D1 migrations
        run: pnpm --filter @repo/operator exec wrangler d1 migrations apply switch-operator-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
