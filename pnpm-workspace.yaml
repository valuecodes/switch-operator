packages:
  - "apps/*"
  - "packages/*"

# Every external dependency version, referenced as `catalog:` from the
# manifests. Update everything with `pnpm up --latest -r`, which rewrites only
# this file and the lockfile.
#
# Not here: `@repo/*` deps (stay `workspace:*`). Scoped keys must be
# double-quoted.
catalog:
  "@cloudflare/playwright": 1.3.6
  # At least the version `wrangler` declares as its peer.
  "@cloudflare/workers-types": 5.20261011.1
  "@hono/zod-validator": 0.9.1
  # Held on the Node 24 line to match `.nvmrc` (see `updateConfig` below).
  "@types/node": 24.19.2
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.4
  hono: 4.13.13
  knip: 6.41.0
  node-html-markdown: 2.0.0
  openai: 7.32.0
  oxfmt: 0.72.0
  oxlint: 1.87.0
  oxlint-tsgolint: 7.0.2004
  tsx: 4.23.15
  turbo: 2.11.7
  # `typescript` is the native (Go) compiler; its binary is still `tsc`.
  typescript: 7.0.2
  vitest: 5.0.3
  wrangler: 4.149.0
  zod: 4.6.5

# Skipped by `pnpm up --latest`. `@types/node` must track the Node major in
# `.nvmrc`, so bump it by hand within that line.
updateConfig:
  ignoreDependencies:
    - "@types/node"

# Makes `pnpm add` / `pnpm update` use the catalog and reject conflicting
# versions. Plain `pnpm install` never evaluates it, so it is an authoring
# guardrail, not a CI check.
catalogMode: strict

# Writes exact versions (no `^` or `~`) on `pnpm add`. pnpm 12 reads only
# auth settings from `.npmrc`, so this has to live here.
saveExact: true

# Security floors for transitive deps whose parents still resolve a vulnerable
# version. Drop an entry once `pnpm audit` stays clean without it.
overrides:
  # drizzle-kit > @esbuild-kit/core-utils pins esbuild 0.18 (GHSA-67mh-4wv8-2f99).
  esbuild: ">=0.28.1"
  # openai, wrangler > miniflare.
  undici: ^7.29.1
  # vitest > vite 8.3.1 (GHSA-587h-7wmj-h5pm, GHSA-698v-4r3x-3vcv,
  # GHSA-r825-w8mm-5pxw, GHSA-rq7h-c2jc-7f22, GHSA-vfpm-58rq-9qcg,
  # GHSA-9jrq-w75r-8gcw). 8.3.4 also pulls postcss 8.5.29 > source-map-js 1.2.2
  # (GHSA-68fv-2mgg-jv7q). Drop once vitest resolves a patched vite on its own.
  vite: 8.3.4

allowBuilds:
  # Still used by Vitest's transforms and Wrangler's bundler.
  esbuild: true
  # Wrangler's local runtime. Its binary ships in the optional
  # @cloudflare/workerd-<platform> package, so the postinstall (a check plus a
  # fallback download) isn't needed. It has to be listed, even as false, or the
  # install fails with ERR_PNPM_IGNORED_BUILDS.
  workerd: false

# pnpm already fails the install when the root `engines.node` doesn't match.
# This also refuses any non-optional dependency whose own `engines` excludes
# the running Node.js, instead of only warning.
engineStrict: true

# 14 days, in minutes: a new release is not resolvable until it is this old.
# So `pnpm up --latest` deliberately skips fresh releases; use
# `minimumReleaseAgeExclude` if one package must move faster.
minimumReleaseAge: 20160

# Fails when a version has weaker trust evidence (provenance, trusted
# publishing) than an earlier one, the usual sign of a hijacked account.
# Also re-checked on `--frozen-lockfile` installs. If a downgrade is
# legitimate, exclude that exact version in `trustPolicyExclude` with a reason,
# never a bare package name.
trustPolicy: no-downgrade
